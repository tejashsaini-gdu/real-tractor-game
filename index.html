<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Real Tractor World - Mobile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#1a5d1a;font-family:Arial;overflow:hidden;height:100vh}
#gameCanvas{background:#8bc34a;display:block;width:100%;height:100vh}
#ui{position:absolute;top:0;left:0;width:100%;padding:10px;display:flex;justify-content:space-between;color:white;font-weight:bold;z-index:10}
#controls{position:absolute;bottom:0;left:0;width:100%;height:180px;display:flex;justify-content:space-between;align-items:flex-end;padding:15px;z-index:20}
#leftPad{width:120px;height:120px;background:rgba(0,0,0,0.3);border-radius:50%;position:relative;border:2px solid white}
#stick{width:50px;height:50px;background:white;border-radius:50%;position:absolute;left:35px;top:35px}
.btn{width:70px;height:70px;border-radius:15px;border:none;font-weight:bold;font-size:11px;margin:5px}
#actionBtns{display:flex;flex-direction:column}
#b1{background:#ffeb3b} #b2{background:#4caf50;color:white} #b3{background:#ff5722;color:white}
#driveBtns button{width:60px;height:60px;background:rgba(0,0,0,0.5);border:2px solid white;border-radius:10px;color:white;font-size:24px}
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:#1a3a1a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;color:white;text-align:center}
#startBtn{padding:15px 40px;font-size:20px;background:#ffeb3b;border:none;border-radius:30px;font-weight:bold;margin-top:20px}
</style>
</head>
<body>
<div id="ui"><span id="score">Ganna: 0/10</span><span id="money">₹0</span></div>
<canvas id="gameCanvas"></canvas>
<div id="controls">
<div style="display:flex;align-items:center;gap:10px">
<div id="leftPad"><div id="stick"></div></div>
<div id="driveBtns"><button id="leftBtn">◀</button><button id="rightBtn">▶</button></div>
</div>
<div id="actionBtns">
<button class="btn" id="b1">GANNA LOAD</button>
<button class="btn" id="b2">TROLLEY</button>
<button class="btn" id="b3">BECHNA</button>
</div>
</div>
<div id="startScreen"><h1>🚜 REAL TRACTOR WORLD</h1><p>Mobile Smooth Edition</p><button id="startBtn">▶ GAME START</button></div>
<script>
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let W,H;function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}resize();
let gameStarted=false;let tractor={x:W/2,y:H/2,angle:0,ganna:0,hasTrolley:false};let keys={left:false,right:false};let joystick={dx:0};let gannaField={x:W*0.2,y:H*0.3};let mill={x:W*0.7,y:H*0.3};let money=0;
const pad=document.getElementById('leftPad');const stick=document.getElementById('stick');let padRect;
pad.addEventListener('touchstart',e=>{padRect=pad.getBoundingClientRect();handleStick(e.touches[0])});pad.addEventListener('touchmove',e=>{e.preventDefault();handleStick(e.touches[0])},{passive:false});pad.addEventListener('touchend',()=>{joystick.dx=0;stick.style.left='35px';stick.style.top='35px'});
function handleStick(t){let cx=padRect.left+60;let cy=padRect.top+60;let dx=t.clientX-cx;let dist=Math.min(Math.sqrt(dx*dx),45);stick.style.left=(35+dx/2)+'px';joystick.dx=dx/45;}
document.getElementById('leftBtn').addEventListener('touchstart',()=>keys.left=true);document.getElementById('leftBtn').addEventListener('touchend',()=>keys.left=false);
document.getElementById('rightBtn').addEventListener('touchstart',()=>keys.right=true);document.getElementById('rightBtn').addEventListener('touchend',()=>keys.right=false);
function tryLoad(){let d=Math.hypot(tractor.x-gannaField.x,tractor.y-gannaField.y);if(d<200&&tractor.ganna<10){tractor.ganna++;updateUI()}else if(tractor.ganna>=10){alert('Full! Mill pe jao')}else{alert('Green Khet me jao')}} 
function tryTrolley(){tractor.hasTrolley=!tractor.hasTrolley;updateUI()} 
function trySell(){let d=Math.hypot(tractor.x-mill.x,tractor.y-mill.y);if(d<200&&tractor.ganna>0){money+=tractor.ganna*50;tractor.ganna=0;updateUI();alert('Bech diya ₹'+money)}else{alert('Mill pe jao ya Ganna load karo')}}
document.getElementById('b1').addEventListener('touchstart',e=>{e.preventDefault();tryLoad()});document.getElementById('b2').addEventListener('touchstart',e=>{e.preventDefault();tryTrolley()});document.getElementById('b3').addEventListener('touchstart',e=>{e.preventDefault();trySell()});
function updateUI(){document.getElementById('score').innerText='Ganna: '+tractor.ganna+'/10';document.getElementById('money').innerText='₹'+money;}
document.getElementById('startBtn').addEventListener('click',()=>{document.getElementById('startScreen').style.display='none';gameStarted=true;gannaField.x=W*0.25;gannaField.y=H*0.3;mill.x=W*0.75;mill.y=H*0.3;loop();});
function loop(){if(!gameStarted)return;if(keys.left||joystick.dx<-0.2)tractor.angle-=0.06;if(keys.right||joystick.dx>0.2)tractor.angle+=0.06;tractor.x+=Math.cos(tractor.angle)*3;tractor.y+=Math.sin(tractor.angle)*3;if(tractor.x<0)tractor.x=W;if(tractor.x>W)tractor.x=0;if(tractor.y<0)tractor.y=H-180;if(tractor.y>H-180)tractor.y=0;draw();requestAnimationFrame(loop);}
function draw(){ctx.fillStyle='#8bc34a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4caf50';ctx.fillRect(gannaField.x-60,gannaField.y-60,120,120);ctx.fillStyle='white';ctx.font='12px Arial';ctx.fillText('GANNA KHET',gannaField.x-35,gannaField.y-70);ctx.fillStyle='#d32f2f';ctx.fillRect(mill.x-50,mill.y-50,100,100);ctx.fillText('SUGAR MILL',mill.x-35,mill.y-60);ctx.fillStyle='#795548';ctx.fillRect(0,H/2-20,W,40);ctx.save();ctx.translate(tractor.x,tractor.y);ctx.rotate(tractor.angle);ctx.fillStyle='#ff5722';ctx.fillRect(-20,-10,35,20);if(tractor.hasTrolley){ctx.fillStyle='#8d6e63';ctx.fillRect(-40,-12,18,24);if(tractor.ganna>0){ctx.fillStyle='#7cb342';ctx.fillRect(-40,-12,18*tractor.ganna/10,24)}}ctx.restore();}
updateUI();
</script>
</body>
</html>
