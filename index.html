<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRACTOR GAME - ONLINE OFFLINE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:sans-serif}canvas{display:block}#menu{position:absolute;inset:0;background:#0a1a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:99;text-align:center;padding:20px}#playBtn{padding:15px 30px;background:#00ff88;color:#000;border:none;border-radius:30px;font-weight:900;font-size:18px;margin-top:20px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body><canvas id="c"></canvas>
<div id="menu"><h1>🚜 REAL TRACTOR WORLD</h1><p>ONLINE + OFFLINE + GANNA TROLLEY</p><p style="font-size:12px;opacity:0.7;margin-top:10px">G = Ganna Load, Y = Trolley, P = Hal, B = Bechna Mill pe</p><button id="playBtn">▶️ GAME START</button><p style="margin-top:10px;font-size:11px;opacity:0.5">tejashsaini-gdu.github.io/real-tractor-game</p></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});renderer.setSize(innerWidth,innerHeight);
scene.add(new THREE.AmbientLight(0xffffff,0.8));const sun=new THREE.DirectionalLight(0xffffff,0.9);sun.position.set(50,80,30);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshStandardMaterial({color:0x8bc34a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(20,1000),new THREE.MeshStandardMaterial({color:0x222}));road.rotation.x=-Math.PI/2;road.position.y=0.05;scene.add(road);
function mkTractor(c){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(2,1,3),new THREE.MeshStandardMaterial({color:c}));b.position.y=1;g.add(b);let ca=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.2,1.3),new THREE.MeshStandardMaterial({color:0x111}));ca.position.set(0,1.8,-0.2);g.add(ca);return g;}
let tractor=mkTractor(0xc62828);scene.add(tractor);let trolley=new THREE.Group();let tb=new THREE.Mesh(new THREE.BoxGeometry(3,0.4,6),new THREE.MeshStandardMaterial({color:0x8d6e63}));tb.position.y=0.9;trolley.add(tb);let ganna=new THREE.Mesh(new THREE.BoxGeometry(2.5,1,5),new THREE.MeshStandardMaterial({color:0xCDDC39}));ganna.position.y=1.7;ganna.visible=false;trolley.add(ganna);trolley.userData.ganna=ganna;scene.add(trolley);
let mill=new THREE.Group();let shed=new THREE.Mesh(new THREE.BoxGeometry(30,12,20),new THREE.MeshStandardMaterial({color:0xb71c1c}));shed.position.y=6;mill.add(shed);mill.position.set(0,0,-150);scene.add(mill);
let pos=new THREE.Vector3(),angle=0,vel=0,steer=0,keys={},gannaLoad=0,money=0;
document.getElementById('playBtn').onclick=()=>{document.getElementById('menu').style.display='none';};
function upd(dt){let f=keys['w']||keys['arrowup'],bk=keys['s']||keys['arrowdown'],l=keys['a']||keys['arrowleft'],r=keys['d']||keys['arrowright'];if(f)vel+=0.015;if(bk)vel-=0.01;vel*=0.98;vel=Math.max(-0.4,Math.min(0.5,vel));let ts=0;if(l)ts=0.8;if(r)ts=-0.8;steer+=(ts-steer)*0.1;if(Math.abs(vel)>0.01)angle+=steer*vel*0.05;pos.x+=Math.sin(angle)*vel*-40*dt;pos.z+=Math.cos(angle)*vel*-40*dt;tractor.position.copy(pos);tractor.position.y=0;tractor.rotation.y=angle;let tx=pos.x+Math.sin(angle)*6,tz=pos.z+Math.cos(angle)*6;trolley.position.set(tx,0,tz);trolley.rotation.y=angle;trolley.userData.ganna.visible=gannaLoad>0;if(mill && gannaLoad>0 && Math.hypot(pos.x-mill.position.x,pos.z-mill.position.z)<20){money+=2000;gannaLoad=0;alert('Ganna Bech Diya! Rs.'+money);}let cp=new THREE.Vector3(pos.x+Math.sin(angle)*12,5,pos.z+Math.cos(angle)*12);camera.position.lerp(cp,0.1);camera.lookAt(pos.x,1,pos.z);}
let last=0;function loop(t){let dt=Math.min(0.03,(t-last)/1000);last=t;upd(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=='g'){gannaLoad=1;}if(e.key.toLowerCase()=='b'&&gannaLoad>0&&Math.hypot(pos.x-mill.position.x,pos.z-mill.position.z)<25){money+=2000;gannaLoad=0;}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
